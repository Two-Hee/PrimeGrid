<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kim부장 HOME</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Malgun Gothic', '맑은 고딕', Arial, sans-serif;
    font-size: 14px;
    color: #1f2937;
    background: #f4f6f8;
  }

  /* 상단 메뉴바 */
  .topbar {
    background: #0b3d63;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    position: relative;
    z-index: 100;
  }
  .topbar ul { list-style: none; display: flex; align-items: center; flex-wrap: wrap; padding: 0 14px; }
  .brand {
    color: #fff;
    font-size: 17px;
    font-weight: 700;
    padding: 14px 20px 14px 6px;
    letter-spacing: 0.5px;
    white-space: nowrap;
    border-right: 1px solid rgba(255,255,255,0.25);
    margin-right: 6px;
    cursor: pointer;
  }
  .topbar > ul > li.menu { position: relative; }
  .topbar > ul > li.menu > a {
    display: block;
    color: #fff;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    padding: 15px 18px;
    white-space: nowrap;
  }
  .topbar > ul > li.menu.active > a,
  .topbar > ul > li.menu:hover > a {
    background: rgba(255,255,255,0.15);
  }

  /* 드롭다운 */
  .dropdown {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    background: #fff;
    border: 1px solid #d8dee4;
    border-top: 3px solid #ef7c1b;
    box-shadow: 0 6px 16px rgba(0,0,0,0.15);
    min-width: 200px;
    z-index: 200;
  }
  .topbar > ul > li.menu:hover > .dropdown { display: block; }
  .dropdown ul { display: block; padding: 6px 0; }
  .dropdown ul li { border-bottom: 1px solid #f0f2f4; }
  .dropdown ul li:last-child { border-bottom: none; }
  .dropdown ul li a {
    display: block;
    color: #24384a;
    text-decoration: none;
    padding: 10px 16px;
    font-size: 13.5px;
  }
  .dropdown ul li a:hover { background: #fef3e7; color: #ef7c1b; }

  /* 콘텐츠 영역 */
  .content {
    width: 100%;
    height: calc(100vh - 46px);
    background: #eef1f4;
  }
  .content iframe { width: 100%; height: 100%; border: none; background: #fff; }

  .welcome {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 8px;
    background: linear-gradient(rgba(11,61,99,0.55), rgba(11,61,99,0.55)), url('solar_bg.jpg') center center / cover no-repeat;
  }
  .welcome h1 { color: #fff; font-size: 28px; text-shadow: 0 2px 6px rgba(0,0,0,0.4); }
  .welcome p { font-size: 14px; color: #f0f3f6; text-shadow: 0 1px 4px rgba(0,0,0,0.4); }

  @media (max-width: 768px) {
    .topbar > ul > li.menu > a { padding: 11px 12px; font-size: 13px; }
    .brand { padding: 11px 12px 11px 6px; font-size: 15px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <ul>
    <li class="brand" onclick="document.querySelector('iframe[name=pages]').src='about:blank'; showWelcome();">Kim부장 HOME</li>

    <li class="menu">
      <a href="#">태양광발전</a>
      <div class="dropdown">
        <ul>
          <li><a href="1.태양광발전/태양광발전량분석(클로드).html" target="pages" onclick="hideWelcome()">발전량분석</a></li>
          <li><a href="1.태양광발전/태양광발전소_설계도면_발전량_분석(260729).html" target="pages" onclick="hideWelcome()">발전량분석(도면기준)</a></li>
          <li><a href="pages/solar_maintenance.html" target="pages" onclick="hideWelcome()">발전량 유지보수</a></li>
          <li><a href="pages/solar_kma_irradiance.html" target="pages" onclick="hideWelcome()">기상청 일사량</a></li>
        </ul>
      </div>
    </li>

    <li class="menu">
      <a href="#">가스엔진발전</a>
      <div class="dropdown">
        <ul>
          <li><a href="pages/gasengine_output.html" target="pages" onclick="hideWelcome()">발전량분석</a></li>
          <li><a href="pages/gasengine_diagram.html" target="pages" onclick="hideWelcome()">기본 계통도</a></li>
          <li><a href="pages/gasengine_cost.html" target="pages" onclick="hideWelcome()">발전금액분석</a></li>
        </ul>
      </div>
    </li>

    <li class="menu">
      <a href="#">가스터빈발전</a>
      <div class="dropdown">
        <ul>
          <li><a href="pages/gasturbine_output.html" target="pages" onclick="hideWelcome()">발전량분석</a></li>
          <li><a href="pages/gasturbine_diagram.html" target="pages" onclick="hideWelcome()">기본계통도</a></li>
          <li><a href="pages/gasturbine_cost.html" target="pages" onclick="hideWelcome()">발전금액분석</a></li>
        </ul>
      </div>
    </li>
  </ul>
</div>

<div class="content">
  <div class="welcome" id="welcome">
    <h1>Kim부장 HOME</h1>
    <p>위 메뉴에서 항목을 선택하세요.</p>
  </div>
  <iframe name="pages" id="pages" style="display:none;"></iframe>
</div>

<script>
  function hideWelcome() {
    document.getElementById('welcome').style.display = 'none';
    document.getElementById('pages').style.display = 'block';
  }
  function showWelcome() {
    document.getElementById('welcome').style.display = 'flex';
    document.getElementById('pages').style.display = 'none';
  }
</script>

</body>
</html>
